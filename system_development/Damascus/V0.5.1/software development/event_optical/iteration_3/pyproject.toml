[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpbf-event-optical"
version = "0.1.0"
description = "Native RAW event camera recorder for LPBF Observer"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4"]

[project.scripts]
event-record = "event_optical.recorder:main"

[tool.setuptools.packages.find]
where = ["src"]
